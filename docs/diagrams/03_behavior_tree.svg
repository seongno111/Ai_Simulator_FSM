<rect x="40" y="1540" width="1720" height="380" rx="14" fill="#FFFFFF" stroke="#DAE2EC" stroke-width="2"/>
<text x="65" y="1587" font-family="Malgun Gothic, sans-serif" font-size="27" font-weight="700" fill="#7251A3">BLACKBOARD  |  데이터 저장과 인물 간 공유</text>
<rect x="65" y="1620" width="1670" height="90" rx="14" fill="#FFFFFF" stroke="#7251A3" stroke-width="2"/>
<text x="80" y="1654" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#7251A3">Shared() — 세 인물이 같은 인스턴스를 참조</text>
<text x="80" y="1685" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#172B46">나무꾼 기록 → SellingWood / VisitingTavern / Drinking     |     상점주인 기록 → SellerInToilet</text>
<rect x="65" y="1740" width="510" height="115" rx="14" fill="#FFFFFF" stroke="#2765B0" stroke-width="2"/>
<text x="80" y="1774" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#2765B0">Local() — 나무꾼</text>
<text x="80" y="1805" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#172B46">Wood / WorkLength / Stamina / Coin</text>
<text x="80" y="1832" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#172B46">Intoxication / SleepProgress</text>
<rect x="610" y="1740" width="535" height="115" rx="14" fill="#FFFFFF" stroke="#167769" stroke-width="2"/>
<text x="625" y="1774" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#167769">Local() — 상점주인</text>
<text x="625" y="1805" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#172B46">Sleep / Cigarette</text>
<text x="625" y="1832" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#172B46">Toilet / ToiletProgress</text>
<rect x="1180" y="1740" width="555" height="115" rx="14" fill="#FFFFFF" stroke="#7251A3" stroke-width="2"/>
