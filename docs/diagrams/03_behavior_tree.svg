<text x="1364" y="839" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="400" fill="#566982">10행동 → 진행도 0</text>
<text x="1275" y="1009" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#566982">접대 동안 작업 위치·진행도 보존</text>
