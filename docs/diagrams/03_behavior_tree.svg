<text x="126" y="1015" font-family="Malgun Gothic, sans-serif" font-size="16" font-weight="400" fill="#566982">5행동 → 취기 0 / 체력 10</text>
<text x="65" y="1139" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#566982">판매·방문·음주 요청을 Shared에 기록</text>
<text x="65" y="1167" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#566982">각 수치와 진행도는 Local에서 읽고 갱신</text>
<text x="65" y="1195" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#566982">음주 행동에서 주점 주인 ServeDrink 호출</text>
