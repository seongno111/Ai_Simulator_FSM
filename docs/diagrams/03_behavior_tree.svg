<text x="1195" y="1805" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#172B46">DishProgress / CleaningProgress</text>
<text x="65" y="1895" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="400" fill="#566982">모든 행동·조건은 타입 키로 Get/Set. 트리 실행 위치는 노드가 기억하며, 블랙보드는 값을 저장한다.</text>
<text x="50" y="1983" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#566982">현재 소스 기준 · 2026-10-11 · 실행 결과가 아닌 구조/호출 설명</text>
