<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2010" viewBox="0 0 1800 2010">
<rect width="1800" height="2010" fill="#F3F6FA"/>
<text x="50" y="73" font-family="Malgun Gothic, sans-serif" font-size="38" font-weight="700" fill="#172B46">03  Behavior Tree + Blackboard</text>
<text x="50" y="117" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#566982">트리 구조는 실제 생성자 구성 기준. 인물별 Update는 한 틱에 최대 한 개의 Action 본문을 실행한다.</text>
<rect x="40" y="155" width="1720" height="76" rx="14" fill="#E8EEF6" stroke="#DAE2EC" stroke-width="2"/>
<text x="65" y="191" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#172B46">REP 반복   ·   SEQ 순차 실행   ·   SEL 후보 선택   ·   PRI 우선 조건 재검사   ·   ? 조건   ·   A 행동</text>
<text x="65" y="218" font-family="Malgun Gothic, sans-serif" font-size="17" font-weight="400" fill="#566982">Running: 계속 실행 / Success: 완료 / Failure: 다음 후보 또는 실패 처리</text>
<rect x="40" y="260" width="510" height="1250" rx="14" fill="#FFFFFF" stroke="#DAE2EC" stroke-width="2"/>
<text x="60" y="307" font-family="Malgun Gothic, sans-serif" font-size="27" font-weight="700" fill="#2765B0">나무꾼</text>
