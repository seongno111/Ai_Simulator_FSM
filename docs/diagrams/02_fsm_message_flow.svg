<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1810" viewBox="0 0 1800 1810">
<rect width="1800" height="1810" fill="#F3F6FA"/>
<text x="50" y="73" font-family="Malgun Gothic, sans-serif" font-size="38" font-weight="700" fill="#172B46">02  FSM 메시지·호출 흐름도</text>
<text x="50" y="117" font-family="Malgun Gothic, sans-serif" font-size="22" font-weight="400" fill="#566982">현재 구현은 메시지 큐/Dispatcher가 아닌 동기식 직접 함수 호출이다. 시간은 위에서 아래로 흐른다.</text>
<rect x="100" y="170" width="280" height="65" rx="14" fill="#FFFFFF" stroke="#2765B0" stroke-width="2"/>
<text x="115" y="204" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#2765B0">나무꾼</text>
<polyline points="240,235 240,1690" fill="none" stroke="#2765B0" stroke-width="3" stroke-dasharray="9 7"/>
<rect x="710" y="170" width="280" height="65" rx="14" fill="#FFFFFF" stroke="#167769" stroke-width="2"/>
<text x="725" y="204" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#167769">상점주인</text>
<polyline points="850,235 850,1690" fill="none" stroke="#167769" stroke-width="3" stroke-dasharray="9 7"/>
<rect x="1320" y="170" width="280" height="65" rx="14" fill="#FFFFFF" stroke="#7251A3" stroke-width="2"/>
<text x="1335" y="204" font-family="Malgun Gothic, sans-serif" font-size="24" font-weight="700" fill="#7251A3">주점 주인</text>
<polyline points="1460,235 1460,1690" fill="none" stroke="#7251A3" stroke-width="3" stroke-dasharray="9 7"/>
<polyline points="240,295 850,295" fill="none" stroke="#2765B0" stroke-width="3"/>
<polygon points="850,295 838.2941876694152,300.654551943446 838.2941876694152,289.345448056554" fill="#2765B0"/>
<text x="265" y="283" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="400" fill="#2765B0">판매 Enter → BeginBuying()</text>
<rect x="890" y="315" width="790" height="78" rx="14" fill="#F8FAFD" stroke="#167769" stroke-width="2"/>
<text x="902" y="344" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#167769">buyingRequested = true / 일반 상태면 Buying</text>
<text x="902" y="372" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#167769">화장실이면 요청만 기록하고 현재 행동 유지</text>
<polyline points="240,445 850,445" fill="none" stroke="#2765B0" stroke-width="3"/>
<polygon points="850,445 838.2941876694152,450.654551943446 838.2941876694152,439.345448056554" fill="#2765B0"/>
<text x="265" y="433" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="400" fill="#2765B0">판매 Execute → CanBuyWood()</text>
<polyline points="850,505 240,505" fill="none" stroke="#167769" stroke-width="3" stroke-dasharray="9 7"/>
<polygon points="240,505 251.7058123305848,499.345448056554 251.7058123305848,510.654551943446" fill="#167769"/>
<text x="265" y="493" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="400" fill="#167769">반환: Buying 상태인가? (bool)</text>
<rect x="65" y="535" width="540" height="82" rx="14" fill="#F8FAFD" stroke="#2765B0" stroke-width="2"/>
<text x="77" y="564" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#2765B0">true: 나무 -1 / 코인 +5</text>
<text x="77" y="592" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#2765B0">false: 자원 변경 없이 다음 틱까지 대기</text>
<rect x="920" y="540" width="760" height="112" rx="14" fill="#F8FAFD" stroke="#B65C20" stroke-width="2"/>
<text x="932" y="569" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#B65C20">상점주인 Update (매 틱)</text>
<text x="932" y="597" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#B65C20">Global.Execute → toilet ≥ 10이면 Toilet</text>
<text x="932" y="625" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#B65C20">현재 상태 Execute → 화장실 5행동 후 복귀</text>
<text x="310" y="675" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="400" fill="#566982">위 구매 가능 확인과 판매를 나무가 남아 있는 동안 반복</text>
<polyline points="240,730 850,730" fill="none" stroke="#2765B0" stroke-width="3"/>
<polygon points="850,730 838.2941876694152,735.654551943446 838.2941876694152,724.345448056554" fill="#2765B0"/>
<text x="265" y="718" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="400" fill="#2765B0">판매 Exit → EndBuying()</text>
<rect x="895" y="750" width="785" height="80" rx="14" fill="#F8FAFD" stroke="#167769" stroke-width="2"/>
<text x="907" y="779" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#167769">buyingRequested = false / 일반 상태면 Working</text>
<text x="907" y="807" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#167769">화장실이면 복귀 시 영업으로 돌아가도록 기록</text>
<polyline points="240,895 1460,895" fill="none" stroke="#2765B0" stroke-width="3"/>
<polygon points="1460,895 1448.2941876694151,900.654551943446 1448.2941876694151,889.345448056554" fill="#2765B0"/>
<text x="265" y="883" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="400" fill="#2765B0">주점 방문 Enter → BeginVisit(나무꾼)</text>
<rect x="1050" y="920" width="650" height="80" rx="14" fill="#F8FAFD" stroke="#7251A3" stroke-width="2"/>
<text x="1062" y="949" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#7251A3">customer 등록 / ServingCustomer로 전환</text>
<text x="1062" y="977" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#7251A3">직전 설거지·청소와 진행도를 보존</text>
<polyline points="240,1070 1460,1070" fill="none" stroke="#2765B0" stroke-width="3"/>
<polygon points="1460,1070 1448.2941876694151,1075.654551943446 1448.2941876694151,1064.345448056554" fill="#2765B0"/>
<text x="265" y="1058" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="400" fill="#2765B0">음주 Execute → ServeDrink(나무꾼)</text>
<rect x="1045" y="1095" width="660" height="80" rx="14" fill="#F8FAFD" stroke="#7251A3" stroke-width="2"/>
<text x="1057" y="1124" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#7251A3">손님 일치 + 접대 중 + 음주 상태 + 코인 ≥ 5</text>
<text x="1057" y="1152" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#7251A3">조건 만족 시 술 판매 대사 출력</text>
<polyline points="1460,1230 240,1230" fill="none" stroke="#7251A3" stroke-width="3" stroke-dasharray="9 7"/>
<polygon points="240,1230 251.7058123305848,1224.345448056554 251.7058123305848,1235.654551943446" fill="#7251A3"/>
<text x="265" y="1218" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="400" fill="#7251A3">반환: 술 제공 가능 여부 (bool)</text>
<rect x="65" y="1260" width="820" height="82" rx="14" fill="#F8FAFD" stroke="#2765B0" stroke-width="2"/>
<text x="77" y="1289" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#2765B0">성공: 코인 -5 / 취기 +5 / 나무꾼 답변 출력</text>
<text x="77" y="1317" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#2765B0">취기 20이면 취침. 돈 부족·제공 실패도 취침으로 전환.</text>
<text x="950" y="1321" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="400" fill="#566982">정상 방문: 음주 4회 반복</text>
<polyline points="240,1410 1460,1410" fill="none" stroke="#2765B0" stroke-width="3"/>
<polygon points="1460,1410 1448.2941876694151,1415.654551943446 1448.2941876694151,1404.345448056554" fill="#2765B0"/>
<text x="265" y="1398" font-family="Malgun Gothic, sans-serif" font-size="21" font-weight="400" fill="#2765B0">음주 Exit → EndVisit(나무꾼)</text>
<rect x="1060" y="1435" width="635" height="80" rx="14" fill="#F8FAFD" stroke="#7251A3" stroke-width="2"/>
<text x="1072" y="1464" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#7251A3">customer 해제 / RevertToPreviousState()</text>
<text x="1072" y="1492" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#7251A3">접대 전 작업과 진행도를 이어감</text>
<rect x="65" y="1550" width="770" height="82" rx="14" fill="#F8FAFD" stroke="#2765B0" stroke-width="2"/>
<text x="77" y="1579" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#2765B0">취침 5행동 → Exit에서 취기 0 / 체력 10 / 거리 0</text>
<text x="77" y="1607" font-family="Malgun Gothic, sans-serif" font-size="19" font-weight="400" fill="#2765B0">출근 상태로 돌아가 전체 시나리오 반복</text>
<rect x="50" y="1695" width="1700" height="60" rx="14" fill="#E8EEF6" stroke="#DAE2EC" stroke-width="2"/>
<text x="75" y="1730" font-family="Malgun Gothic, sans-serif" font-size="20" font-weight="400" fill="#172B46">매 틱 갱신 순서: 나무꾼 → 상점주인 → 주점 주인  |  실선: 호출 / 점선 반환 화살표: 결과 반환</text>
<text x="50" y="1783" font-family="Malgun Gothic, sans-serif" font-size="18" font-weight="400" fill="#566982">현재 소스 기준 · 2026-10-11 · 실행 결과가 아닌 구조/호출 설명</text>
</svg>